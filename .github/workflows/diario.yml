name: Liturgia diaria al Kindle

on:
  schedule:
    # IMPORTANTE: GitHub puede retrasar estas ejecuciones varias horas (pasa con
    # cuentas nuevas). Lo que de verdad dispara el envío puntual es el despertador
    # externo (cron-job.org, ver README). Estas quedan como respaldo.
    # Hora de España (GitHub ajusta solo el cambio de horario de verano).
    # El libro debe estar en el Kindle antes de las 3:00.
    #  - 00:37, 01:17, 01:57: solo se envía si el libro está completo.
    #  - 02:27: si aún falta algo, se envía lo que haya (con aviso).
    #  - 04:47, 06:47: rescate; si antes solo salió incompleto, envía el completo.
    # Si ya se envió el libro completo, los demás intentos no hacen nada.
    - cron: "37 0 * * *"
      timezone: "Europe/Madrid"
    - cron: "17 1 * * *"
      timezone: "Europe/Madrid"
    - cron: "57 1 * * *"
      timezone: "Europe/Madrid"
    - cron: "27 2 * * *"
      timezone: "Europe/Madrid"
    - cron: "47 4 * * *"
      timezone: "Europe/Madrid"
    - cron: "47 6 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      enviar:
        description: "Enviar al Kindle (desmarca para solo crear el EPUB y descargarlo)"
        type: boolean
        default: true
      programado:
        description: "Aviso del despertador externo (cron-job.org): no reenviar si ya se envió"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: liturgia-diaria
  cancel-in-progress: false

jobs:
  liturgia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar y enviar el libro
        id: generar
        env:
          ENVIAR: ${{ github.event_name == 'schedule' || inputs.enviar }}
          # El despertador externo llama con programado=true: se comporta como un envío
          # programado (no repite el libro si ya salió). A mano, siempre se envía.
          EVENTO: ${{ (github.event_name == 'schedule' || inputs.programado) && 'schedule' || github.event_name }}
          ORDEN: ${{ vars.ORDEN }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python generar.py --guardar-html paginas

      - name: Validar el EPUB (EPUBCheck)
        if: always() && hashFiles('salida/*.epub') != ''
        run: |
          pip install epubcheck==5.3.0
          python pruebas/validar_epub.py salida/*.epub || echo "::warning::EPUBCheck encontró problemas en el libro"

      - name: Guardar el libro (descargable 14 días)
        if: always() && hashFiles('salida/*.epub') != ''
        uses: actions/upload-artifact@v4
        with:
          name: liturgia-${{ github.run_id }}
          path: |
            salida/*.epub
            paginas/
          retention-days: 14

      - name: Anotar el envío
        # Además, este pequeño cambio mantiene el repositorio «activo» para que
        # GitHub nunca desactive la tarea programada por inactividad.
        if: always()
        run: |
          if [ -n "$(git status --porcelain estado/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado/
            if grep -q parcial estado/ultimo_envio.txt; then
              git commit -m "Enviada (incompleta) la liturgia del $(cut -d' ' -f1 estado/ultimo_envio.txt)"
            else
              git commit -m "Enviada la liturgia del $(cat estado/ultimo_envio.txt)"
            fi
            git pull --rebase -q || true
            git push
          fi
